# Default values for automata.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: docker.io/library/automata
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "local"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 4000

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: true
  className: "traefik"
  # Let's Encrypt cluster issuer annotation
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: automata.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: automata-tls
      hosts:
        - automata.local

# PostgreSQL for automata main app
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16"
  auth:
    username: postgres
    password: postgres
  resources:
    {}

# Matrix Synapse configuration
elementWeb:
  enabled: true
  image:
    repository: vectorim/element-web
    tag: "v1.12.23"
  # URL the user's browser uses to reach the Matrix homeserver (NodePort 30081).
  homeserverUrl: "http://localhost:30081"
  tailscale:
    enabled: true
    host: automata.example.com

matrix:
  enabled: true
  serverName: matrix.example.com
  tailscale:
    enabled: true
    hostname: automata-matrix.example.com
  registrationEnabled: false
  adminPassword: ""
  signingKey: ""
  macaroonSecret: ""
  expireMacaroonSecretKey: ""
  picoidKey: ""
  image:
    repository: matrixdotorg/synapse
    tag: "v1.97.0"
  postgresql:
    image:
      repository: postgres
      tag: "16"
    auth:
      username: postgres
      password: postgres
    resources:
      {}
  ingressPaths:
    - path: /_matrix
      pathType: ImplementationSpecific
      port: 8008
    - path: /_synapse
      pathType: ImplementationSpecific
      port: 8008
  resources:
    {}


# YugabyteDB cluster (for Temporal storage)
yugabyte:
  enabled: false
  replicas: 3
  image:
    repository: yugabytedb/yugabyte
    tag: "2025.2.5.2-b5-x86_64"
  ysqlPort: 5433
  masterRpcPort: 7100
  tserverRpcPort: 9100
  hostPath: /var/lib/automata-yugabyte
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Temporal configuration
temporal:
  enabled: true
  image:
    repository: temporalio/auto-setup
    tag: "1.26.2"
  postgresql:
    image:
      repository: postgres
      tag: "16"
    auth:
      username: postgres
      password: postgres
    resources:
      {}
  useYugabyte: false
  resources:
    {}

tailscale:
  # Enable Tailscale Ingress custom resource generation
  enabled: true
  className: "tailscale"
  annotations: {}

tailscale-operator:
  # Enable installing the tailscale operator as a subchart
  enabled: false
  oauth:
    clientId: ""
    clientSecret: ""

env:
  # Typically set via secrets in production, but defined here for template generation
  PHX_HOST: automata.local
  SECRET_KEY_BASE: ""
  DATABASE_URL: ""
  POOL_SIZE: "10"

# Additional environment variables sourced from existing Kubernetes Secrets.
# Each entry is a Secret name; all its keys are injected as env vars.
envFromSecrets: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# livenessProbe:
#   httpGet:
#     path: /up
#     port: http
# readinessProbe:
#   httpGet:
#     path: /up
#     port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
